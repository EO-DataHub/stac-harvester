[project]
name = "STAC-Harvester"
version = "0.1.5"
description = "Harvest upstream STAC catalogs"
readme = "README.md"

requires-python = ">=3.13,<3.14"

license = {file = "LICENSE"}

authors = [
  {name = "Telespazio UK Ltd", email = "alex.palmer@telespazio.com" }
]

maintainers = [
  {name = "Telespazio UK Ltd", email = "alex.palmer@telespazio.com" }
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "boto3",
    "botocore",
    "pystac-client",
    "pystac",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-processor-baggage",
    "opentelemetry-instrumentation-logging",
    "eodhp-utils @ git+https://github.com/UKEODHP/eodhp-utils@feature/EODHP-830-fixing-invalid-links-otel"
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-mock",
    "pytest-watcher",
    "pytest-xdist",
    "ruff",
    "validate-pyproject",
    "moto",
    "munch",
    "requests-mock",
]

[project.urls]
homepage = "https://github.com/EO-DataHub/"
repository = "https://github.com/EO-DataHub/stac-harvester"
changelog = "https://github.com/EO-DataHub/stac-harvester/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true

[tool.uv.sources]
eodhp-utils = { git = "https://github.com/UKEODHP/eodhp-utils", rev = "feature/EODHP-830-fixing-invalid-links-otel" }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
markers = [
  "integrationtest: Integration test"
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "FAST", # FastAPI
    "RUF",  # RUF-specific rules
    "SIM",  # Simplifications
    "B",    # Bugbear
    "ANN",  # Annotations
    "PLC",  # Pylint convention
    "PLE",  # Pylint errors
    "UP",   # pyupgrade
    "FURB", # refurb
    "PT",   # pytest
]
ignore = [
    "E501",   # line too long
    "SIM108", # ternary operator
    "SIM103", # return bool directly
    "B008"    # function call in default argument (incompatible with FastAPI)
]
